name: Build dmg

on:
  workflow_call:
    inputs:
      sign:
        description: Sign the app with the Developer ID certificate and notarize it.
        type: boolean
        required: true
    secrets:
      APPLE_TEAM_ID:
        required: false
      DEVELOPER_ID_CERTIFICATE_P12:
        required: false
      DEVELOPER_ID_CERTIFICATE_PASSWORD:
        required: false
      APPLE_API_KEY:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER_ID:
        required: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.85
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build xcframework
        run: sh build-xcframework.sh

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      # Install third-party tools before the signing certificate is imported.
      - name: Install dmg tools
        run: |
          brew install graphicsmagick imagemagick
          npm install --global create-dmg@8.1.0

      - name: Setup code signing
        if: ${{ inputs.sign }}
        env:
          DEVELOPER_ID_CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          # Create a temporary keychain and add it to the search list.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user | xargs security list-keychains -d user -s "$KEYCHAIN_PATH"

          # Import the Developer ID Application certificate, with a non-extractable private key.
          echo "$DEVELOPER_ID_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN_PATH" -P "$DEVELOPER_ID_CERTIFICATE_PASSWORD" -f pkcs12 -x -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          rm "$RUNNER_TEMP/certificate.p12"

          # Save the App Store Connect API key for notarytool.
          echo "$APPLE_API_KEY" > "$RUNNER_TEMP/api-key.p8"
          xcrun notarytool store-credentials notarytool \
            --key "$RUNNER_TEMP/api-key.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --keychain "$KEYCHAIN_PATH"
          rm "$RUNNER_TEMP/api-key.p8"

      - name: Xcode build
        if: ${{ !inputs.sign }}
        run: |
          cd ui
          xcodebuild archive \
            -scheme iPortForwarder \
            -archivePath build.xcarchive \
            -configuration Release \
            ONLY_ACTIVE_ARCH=NO
          ditto build.xcarchive/Products/Applications/iPortForwarder.app build/iPortForwarder.app

      - name: Xcode build (signed)
        if: ${{ inputs.sign }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd ui
          xcodebuild archive \
            -scheme iPortForwarder \
            -archivePath build.xcarchive \
            -configuration Release \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
          xcodebuild -exportArchive \
            -archivePath build.xcarchive \
            -exportPath build \
            -exportOptionsPlist ExportOptions.plist

      - name: Make dmg
        run: create-dmg --no-code-sign --no-version-in-filename 'ui/build/iPortForwarder.app'

      - name: Sign dmg and submit for notarization
        if: ${{ inputs.sign }}
        run: |
          codesign --sign 'Developer ID Application' --timestamp iPortForwarder.dmg
          xcrun notarytool submit iPortForwarder.dmg \
            --keychain-profile notarytool \
            --keychain "$KEYCHAIN_PATH" \
            --output-format json > submission.json
          cat submission.json
          NOTARIZATION_ID="$(plutil -extract id raw -o - submission.json)"
          echo "NOTARIZATION_ID=$NOTARIZATION_ID" >> "$GITHUB_ENV"

      # The first submissions from a new team can take an hour or more.
      - name: Wait for notarization
        if: ${{ inputs.sign }}
        run: |
          xcrun notarytool wait "$NOTARIZATION_ID" \
            --keychain-profile notarytool \
            --keychain "$KEYCHAIN_PATH" || true
          xcrun notarytool log "$NOTARIZATION_ID" \
            --keychain-profile notarytool \
            --keychain "$KEYCHAIN_PATH" || true
          xcrun notarytool info "$NOTARIZATION_ID" \
            --keychain-profile notarytool \
            --keychain "$KEYCHAIN_PATH" \
            --output-format json > notarization.json
          cat notarization.json
          test "$(plutil -extract status raw -o - notarization.json)" = Accepted
          xcrun stapler staple iPortForwarder.dmg
          spctl --assess --type open --context context:primary-signature --verbose iPortForwarder.dmg

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iPortForwarder
          path: ${{ github.workspace }}/iPortForwarder.dmg
