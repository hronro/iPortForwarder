name: Build Releases

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      sign: true
    secrets: inherit

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: iPortForwarder

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: iPortForwarder.dmg
