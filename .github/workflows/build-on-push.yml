name: Build dmg On Push

on:
  push:
    branches:
      - master
  # Run manually to get a signed and notarized build, e.g. to test code signing before a release.
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      sign: ${{ github.event_name == 'workflow_dispatch' }}
    secrets: inherit
